name: tylas_sweet
description: "Sitio web oficial de Tylas Sweet con radio en vivo"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  url_launcher: ^6.3.0
  google_fonts: ^6.2.1
  just_audio: ^0.9.36 # <--- Fundamental para que la radio no dé error

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true

  # Configuración de imágenes (Asegúrate de que las carpetas existan)
  assets:
    - assets/images/logo.png
    - assets/images/ # Esto incluye todas tus fotos postre (1).jpeg, etc.
    - assets/postres/